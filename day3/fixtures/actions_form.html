<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Actions: form</title>
</head>
<body>
  <label>Name <input type="text" /></label>
  <br />
  <label>Birth date <input type="date" /></label>
  <br />
  <label>Appointment time <input type="time" /></label>
  <br />
  <label>Local time <input type="datetime-local" /></label>
  <br />

  <label><input type="checkbox" /> I agree to the terms above</label>
  <br />
  <label><input type="checkbox" /> Subscribe to newsletter</label>
  <br />

  <label><input type="radio" name="size" value="S" /> S</label>
  <label><input type="radio" name="size" value="M" /> M</label>
  <label><input type="radio" name="size" value="XL" /> XL</label>

  <br />
  <label>Choose a color
    <select>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
    </select>
  </label>

  <br />
  <label>Choose multiple colors
    <select multiple>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="yellow">Yellow</option>
    </select>
  </label>

  <br />
  <label>Upload file <input type="file" /></label>
  <br />
  <label>Upload files <input type="file" multiple /></label>
  <br />
  <label>Upload directory <input type="file" webkitdirectory /></label>

  <br />
  <label>password <input type="password" /></label>
</body>
</html>
